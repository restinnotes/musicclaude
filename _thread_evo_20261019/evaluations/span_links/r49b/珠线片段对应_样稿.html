          "measures": "1–23",
          "text": "短句像叹息，刚冒出来就被长停顿截断；听着余音在冰冷的空气里慢慢散尽。心里明明有东西，却还分不清这份不平静究竟是愤怒、遗憾还是怀念——这是一种尚未找到对象、也尚未找到语言的失落。"

          "text": "刚才那点安稳忽然没了，他一下慌了：以后再碰上难事，若还是得一个人熬，自己真能一直撑得住吗？"

        },
        {
          "id": "S07-3",
          "text": "他想回头找回那份亲近，可当初受的委屈又拦着他；他也想找回最初离开时的那份坚决，却怎么也找不回来了。"

          "role": "主体验",
          "measures": "182附近",
          "text": "m.182附近，高音区忽然浮出一串轻得像游丝、却带着刺骨寒意的长颤音。它像寒风猛地吹开紧闭的窗，把人从甜梦里生生拽回严寒；后颈一凉，脉搏也剧烈跳动。梦境不是慢慢淡去，而像突然破裂，身体先被惊醒。这一瞬间的寒意和惊悸，是这次转向最鲜明的身体感受。"
        },
        {
          "id": "S07-B2",
          "sec": "S07",
          "role": "段内变化",
          "measures": "182–197",
          "text": "同一转向里，带马祖卡色彩的舞蹈性材料闯了进来，和前一刻近乎祈祷的静谧形成反差。它不像沿着刚才那条深沉的思路继续往下讲，而像突然换了一个场景，原先的思绪被截断，音乐从别处重新开讲。这种突兀的换向并不等于情绪好转；新出现的舞步可以很鲜明，内心却未必因此安定下来。"
        },
        {
          "id": "S07-B3",
          "sec": "S07",
          "role": "段内变化",
          "measures": "198–205",
          "text": "到了198–205，连续颤音让紧张一层层累积，思绪像不停翻转，想停也停不下来。事情表面上仿佛已经过去，身体和情绪却还没有完全相信一切结束。心里有东西在颤动，想要冲出去，却始终找不到真正的出口。这不是前一刻的惊醒本身，而是随后持续盘旋、难以平复的紧张。"
        },

          "id": "S07-B4",
          "sec": "S07",
          "role": "另一种理解",
          "measures": "182–197",
          "text": "同一段还有另一种材料辨认：一些原稿把182–197听成先前更具宣告性、带有波兰舞曲气质的材料重新出现。但即使采用这一听法，它也不再像最初那样，以完整而鲜明的姿态建立秩序。这是对音乐材料的另一种理解，不是断言它已经完成了主题回归；更不必把它讲成一个人重新站直、重新找回旧日自我的连续故事。"
        },
        {

          "sec": "S07",
          "role": "另一侧面",
          "measures": "181–205",
          "text": "另一个可以同时浮现的联想，是一种非常具体、非常生活化的记忆突然闯进深沉的感受里：一个熟悉的动作、一次舞蹈、一段曾经习以为常的生活。这不是对舞曲主题身份的判断，也不必和上面的材料辨认拼成一个人的连续经历。这样的亲切感未必安慰人；恰恰因为那些细节具体而熟悉，反而更容易意识到自己已经失去了什么。"

function workChanged(){const sections=DATA.sections.filter(s=>s.work===$('#work').value);$('#tabs').replaceChildren(...sections.map(s=>{const b=el('button','tab',s.sec);b.dataset.sec=s.sec;b.onclick=()=>show(s);return b}));show(sections[0])}

$('#scope').textContent='样稿 · 两首作品 / '+DATA.sections.length+' 个段落';$('#footer').textContent='基于 '+DATA.tag+' 已写定正文的片段标注样稿。对应表示情境联系，不把珠子的声音或意象写成真实情节；此页不是全曲覆盖验收结论。';$('#work').onchange=workChanged;$('#clear').onclick=()=>{active.clear();focusUpdate()};$('#download').onclick=()=>{const blob=new Blob([JSON.stringify(DATA,(key,value)=>key==='group'?undefined:value,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='珠线片段对应_'+DATA.tag+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
try{workChanged()}catch(e){$('#columns').replaceChildren(el('div','error','标注未通过原文核对：'+e.message));throw e}
</script></body></html>
