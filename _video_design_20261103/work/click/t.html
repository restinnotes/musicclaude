<main>
<p class="lead">钢琴：迪努·利帕蒂。正文是一个人在这首曲子里经历的一件事（线），缩进的是听感记录（珠子）。点任意一句，音乐跳到那里。</p>

</main>
<script>
const D=[{"bars": "1–3", "rel": "还说不清", "t0": 0.0, "rows": [{"k": "line", "text": "他忽然发现自己那么想靠近这个人，心里一下热起来，连自己也有点意外。", "t": 0.0}, {"k": "bead", "text": "开头那两下响亮的和弦，有一点突然。声音像夏夜威尼斯上空升起的一束烟花，先向高处迸发，细碎的光点再缓缓飘落。落下来以后，却还没有真正落稳，仿佛仍悬在水面上方；船歌那种稳定的摇荡感还没有真正成形。", "t": 0.0, "bars": "1–3", "alt": false}, {"k": "line", "text": "他怕让对方看见自己有多需要这份亲近，会让对方觉得负担太重，所以只敢露出一点点。", "t": 0.0}, {"k": "bead", "text": "像一个人准备对很亲近的人说一件已经想了很久的事，话还没出口，先有几秒钟沉默。心里很清楚自己要说什么，正因为太清楚，又明白有些话一旦说出口，关系就会改变，所以格外谨慎。", "t": 0.0, "bars": "1–3", "alt": false}, {"k": "bead", "text": "也可以把开场听成一脚踏上小船：木板微晃，水波在脚下荡开，身体有一瞬失重。有些演奏让开头仿佛已经在水上轻摇，另一些则让声音先悬在空中。这里是刚刚踏上船板的感觉，还不是整个人已经安稳地交给规律起伏的水浪。", "t": 0.0, "bars": "1–3", "alt": false}, {"k": "line", "text": "只是这么一点亲近就让他觉得甜，他还拿不准，下次自己能不能更坦白些。", "t": 0.0}]}, {"bars": "4–16", "rel": "正在面对", "t0": 18.74, "rows": [{"k": "line", "text": "对方没有因为他露出在意就退开，仍愿意跟他亲近，他才渐渐放松下来。", "t": 26.88}, {"k": "bead", "text": "右手的两条旋律线贴得很近，像两个紧挨在一起的人耳语，肩膀挨着肩膀，连呼吸都贴在一起，体温也仿佛融在了一处。也像相识已久的人安静坐着，不必拼命找话题；对方偶尔望来一眼，沉默也不让人紧张。若把这份温存听成肌肤的感觉，又仿佛夏末水面潮湿、温热的微风，裹在皮肤上有些黏稠。", "t": 26.88, "bars": "6–16", "alt": false}, {"k": "bead", "text": "第4–5小节，歌声还没真正浮出来，左手已经像心跳，也像无止境的水浪，一下一下地摇着。脚下仿佛不必再踩实地面，可以放弃对重力的控制，把身体交给船底温柔的托举。但水波不会停：人在船上舒服地漂着，暂时不急着靠岸，水却一直在流，时间也一直在走。", "t": 18.74, "bars": "4–16", "alt": false}, {"k": "line", "text": "他也想顺势靠得更近，有一阵子喜欢得几乎藏不住，最后还是怕太急弄坏眼下的自在而收住了。", "t": 52.2}, {"k": "bead", "text": "到第12–14小节，先前小心收着的歌声忽然往上涌了一次，像感情终于忍不住说得热切了一些，连呼吸都跟着改变。可是第14–16小节，它没有继续冲向高潮，而像轻轻呼出一口气，重新回到柔和。声音短暂落稳，又漂起来一点，没有把心事彻底说死。", "t": 52.2, "bars": "12–16", "alt": false}, {"k": "line", "text": "两个人待在一起这么好，他偏偏想到这样的时刻总会过去，还没分开就先有一点舍不得。", "t": 31.06}, {"k": "bead", "text": "几次柔软的落音，像一根温柔的刺。它既像是甜蜜的确认，又带着一点无法排遣的惆怅：眼前的好还在，心里却已经有一点鼻酸。因为太喜欢眼前的东西，所以还没有失去，就已经生出一丝舍不得，忍不住希望这一刻再慢一点过去。", "t": 31.06, "bars": "7–11", "alt": false}]}, {"bars": "17–23", "rel": "没在想", "t0": 75.08, "rows": [{"k": "line", "text": "他难得不去琢磨两个人往后会怎样，只想舒舒服服地待在这份亲近里。", "t": 75.08}, {"k": "bead", "text": "刚才的歌声渐渐退到后面，剩下一阵阵流动、盘旋，水波般的摇曳托着身体，只感觉自己在摇晃、漂浮，暂时“不去哪里”。像说过一句重要的话以后，人还停留在那句话里面，有一点陶醉，有一点走神。也可以想成亲密交谈后忽然安静下来：沉默并不尴尬，反而很舒服；身体还在这里，心却已经慢慢漂远。", "t": 75.08, "bars": "17–23", "alt": false}, {"k": "line", "text": "中间他忽然想告诉对方自己多喜欢这样待着，也想问对方是不是一样，可还没想好怎么开口，念头就慢慢淡了。", "t": 88.1}, {"k": "bead", "text": "约在第20–21小节，持续摇曳中忽然冒出几句短促、稍显急切的声音。像心里闪过一个急于表达的念头，却很快又沉了回去；它只在水面上露了一下头，没有变成一场真正的倾诉。", "t": 88.1, "bars": "20–21", "alt": false}, {"k": "bead", "text": "水波还在晃，流动却像受了牵绊。约在第20–22小节，平稳的“对话”有一种被水下暗流拖住的感觉，音乐绕远、滞留，某些声音像被挂在半途。若换一种更纷乱的听法：思绪像被风吹碎的倒影，粼粼闪烁却难以拼凑完整；仿佛亲密的谈话触碰到了某些无法解开的结。音乐并未走向悲剧，却在那份顺畅之中生出了阻力。", "t": 75.08, "bars": "17–23", "alt": false}]}, {"bars": "24–34", "rel": "正在面对", "t0": 107.64, "rows": [{"k": "line", "text": "熟悉的亲近又让他满心欢喜，想起那句没来得及说的话，他这次更想让对方知道自己有多喜欢。", "t": 107.64}, {"k": "bead", "text": "第24小节，熟悉的歌声又回来了。两道紧贴的声线仍像两个人在耳边低语，呼吸挨得很近；但这一遍比第一次更华丽、更迫切。细密的花腔仿佛水面折射的光斑，突然晃得人睁不开眼。也可以像听一个人谈往事：刚开始还能微笑着讲，讲着讲着语速变了；本来一句话已经够了，却忍不住再说一遍，又折回来补上更多细节。", "t": 107.64, "bars": "24–34", "alt": false}, {"k": "line", "text": "他几乎想把藏着的话全说出来，盼着对方能接受自己这样坦白，可真要开口又怕对方觉得太多。", "t": 133.88}, {"k": "bead", "text": "到第32小节附近，高处的长颤音像夕阳在水面切出的最后一道金光，亮得几乎刺眼，仿佛把情绪一下照到最炽热的地方。这又像想把最深的情意说出口，却在喉咙口颤抖、哽咽：右手在高处悬停，左手的水波却仍推着你往前走。这股情绪一瞬间像是完整地打开了，可音乐一边奋力向高处攀升，一边又渐渐收弱，并没有稳稳落下。到第34小节，摇晃渐渐放慢，仿佛方才吐露的话语还在空气里回荡，人却安静下来。", "t": 133.88, "bars": "30–34", "alt": false}, {"k": "line", "text": "他甚至想靠多说一些把这段好时光留久一点，却又怕说得太急会弄丢两个人原有的自在，最后还是没把话全说出口。", "t": 107.64}, {"k": "bead", "text": "还有一种几乎能落到手指上的触感：原本只是轻轻握着另一个人的手，后来不自觉地握得更紧。自己也许还没有意识到在害怕什么，动作已经先透露了出来。另一幅更晃荡的画面，是想用力抱紧对方、牢牢抓住当下；但你越用力，水面的颠簸就越剧烈，船舱内的平衡就越脆弱。", "t": 107.64, "bars": "24–34", "alt": false}, {"k": "bead", "text": "这里还有一种甜蜜，会让人鼻子发酸。明明美好的东西仍在发生，两道声线仍贴得那么近，左手的水波却一直向前流，仿佛每一秒都在倒数。还没有失去什么，就已经舍不得了；歌声越美，越让人想多留在这一刻。", "t": 107.64, "bars": "24–34", "alt": false}]}, {"bars": "35–39", "rel": "正在面对", "t0": 159.32, "rows": [{"k": "line", "text": "这一次他不再时时想着要把喜欢藏好，心意就在相处里自然露了出来，等他察觉时，对方已经看出他有多在乎。", "t": 159.32}, {"k": "bead", "text": "此前还像要用力抱紧对方、牢牢抓住当下；到了这里，音乐却仿佛自己松开了手，深吸一口气。刚才那阵想攥紧不放的冲动，终于轻轻退了下去。", "t": 159.32, "bars": "35–39", "alt": false}, {"k": "line", "text": "先前藏着时，他还可以装作不那么在乎，如今被看见了，他反而不知道该怎么办，心里空落落的。", "t": 159.32}, {"k": "bead", "text": "原来一直托着你的水波和摇晃，忽然像被抽掉了。丰满的声音只剩下一条单薄、孤零零的旋律，在空中漫无目的地游走。人仿佛突然失去了脚下的支撑，连时间也松开了；像小船漂进一片起雾的水域，前路未卜。", "t": 159.32, "bars": "35–39", "alt": false}, {"k": "bead", "text": "刚才仿佛还有两个人在贴近耳语，到了这里，交谈却戛然而止。一个人从“我与你”的亲密中抽身，转而跌回自己的内心；像一句快到嘴边的重要话又悬在了唇边，心里甚至会闪过一个小小的疑问：“这份幸福是真实的吗？它能维持多久？”", "t": 159.32, "bars": "35–39", "alt": false}, {"k": "line", "text": "他忍不住担心对方会嫌自己太黏，连原本熟悉的亲近，在他心里也像忽然隔了一层。", "t": 159.32}]}, {"bars": "40–50", "rel": "正在面对", "t0": 177.7, "rows": [{"k": "line", "text": "可对方依然照旧亲近他，并没有因为看出他的心意而冷淡下来，他慢慢又能放松地跟对方待着了。", "t": 177.7}, {"k": "bead", "text": "方才悬在空中的音乐，到了第40小节，像重新落在一片陌生的水域。熟悉的摇摆回来了，却不再沉甸甸：左手的波浪变薄、碎成细密的小纹。光线仿佛从暖金色的水面滑入古桥阴影，空气一下凉了；A大调的新旋律清澈、舒展，近乎一支朴素的牧歌。那份纯净像清凉、空灵的月光，又让人忽然想起童年，或年少时第一次心动的下午。", "t": 177.7, "bars": "40–50", "alt": false}, {"k": "line", "text": "安静下来以后，他想到对方根本不知道他刚才有多怕被嫌弃，忽然觉得有点孤单。", "t": 177.7}, {"k": "bead", "text": "这支清澈的新歌并非全然平静。旋律压低声音，旁边另一条声线不时回应、插话，又不断与它纠缠；像一个念头好不容易安静下来，却又回来：“算了”“但还是放不下”。声音时而靠近，时而退开。那份低声也有另一种听法：像一个人说着说着，忘记了自己正被别人看着，不是哭泣或崩溃，只是不再努力显得完整。", "t": 177.7, "bars": "40–50", "alt": false}, {"k": "bead", "text": "这份安静，也像一个人独自退回了内心深处。白天明明和某个人相处得很好，晚上回到家后，心头却泛起一阵酸楚。独处把幽微的感受放大了：即使是最亲密的人，也没法陪你走进心里的每一个角落。甚至当美好的时光仍在眼前流淌时，恍惚间却像已经成了回忆。", "t": 177.7, "bars": "40–50", "alt": false}, {"k": "line", "text": "他又忍不住想，对方既然一直没有退开，会不会也有一点舍不得结束这份亲近？", "t": 177.7}, {"k": "bead", "text": "还有人听到的恰好不是感官欲望退潮，而是一种更贴身的沉醉。那份感觉像水波一样，一层一层荡开，像独自回想一段关系：气味、身体感觉、幻想、遗憾、快感混在一起。它越舒服，反而越让人失去方向。", "t": 177.7, "bars": "40–50", "alt": true}]}, {"bars": "51–61", "rel": "正在面对", "t0": 217.02, "rows": [{"k": "line", "text": "想起这些日子对方总愿意和他待在一起，他渐渐觉得，这份亲近也许不是自己一个人在需要，对方有时可能也想让他陪在身边。", "t": 217.02}, {"k": "bead", "text": "这段歌声再回来，原先的清澈还没消失，底下却越来越不安分：伴奏音符变密，内声部像水底的暗涌不断攀爬，低音的八度与切分像沉重的脉搏在催促。原先压着的感受反而变成了动力，光是安静地享受已经不够，身体仿佛被一股更深的渴望推着往前。那热度甚至像情欲、执念与对生的眷恋，从心底一齐翻涌上来。", "t": 217.02, "bars": "51–61", "alt": false}, {"k": "bead", "text": "什么都还很好，可你已经听见时间正在经过。音乐并没有彻底变暗，美也没有消失；只是这一刻纵然完美，你也没有办法让它停住。", "t": 223.7, "bars": "53–61", "alt": false}, {"k": "line", "text": "这个念头让他高兴得有点收不住，越是想着两个人亲近的感觉，越舍不得抽身，整个人都陷在那股欢喜里。", "t": 217.02}, {"k": "bead", "text": "这股热度还有一种舍不得抽身的快感。像独处时反复回想一段关系，记忆慢慢变成气味、身体感觉、幻想、遗憾和快感，混在一起。它有一点情色性的暖意；越舒服，越让人失去方向。你明知道自己正在被卷进去，却暂时不想出来。", "t": 217.02, "bars": "51–61", "alt": false}, {"k": "line", "text": "他真盼着以后对方想要人陪的时候，自己都能在身边。", "t": 217.02}]}, {"bars": "62–71", "rel": "正在面对", "t0": 258.34, "rows": [{"k": "line", "text": "上回是放松了遮掩才不知不觉被看见，这回他想自己主动一点，大大方方地回应对方的亲近。", "t": 258.34}, {"k": "bead", "text": "旋律忽然变得直接、舒展，近乎意大利歌剧里的咏叹调。没有哲学，没有防卫，没有分析。歌句越唱越开，情绪一再抬高，连熟悉的摇荡也仿佛在轻轻催促。", "t": 258.34, "bars": "62–70", "alt": false}, {"k": "bead", "text": "同一阵歌声又明亮、轻盈、透气，像重新接触到阳光和风。连身体也像恢复了弹性，甚至带一点玩心；这份灵动，也像轻快的调情与回应。", "t": 258.34, "bars": "62–70", "alt": false}, {"k": "line", "text": "这样想着，他连往后的日子都开始盼了，觉得两个人说不定还能这么好很久。", "t": 283.42}, {"k": "bead", "text": "到了第69–70小节，歌声没有踏踏实实地落定，反而向上散掉、蒸发了。约第71小节，正当你以为它还会继续唱下去，它却戛然而止，转入片刻静意。快乐的余温尚在，心头却已泛起一阵怀念。", "t": 283.42, "bars": "69–71", "alt": false}, {"k": "line", "text": "可往后的事到底没法预先说准，他才刚觉得轻快，心里又有了一点没底。", "t": 258.34}]}, {"bars": "72–77", "rel": "正在面对", "t0": 297.7, "rows": [{"k": "line", "text": "那点没底越来越具体：要是哪天对方不再需要他的陪伴，连和他待在一起也不愿意了呢？", "t": 297.7}, {"k": "bead", "text": "前面那股几乎要冲出去的势头，到了这里却突然收住脚步。熟悉的摇摆退到一旁，像话说到要紧处一下顿住。到第76–77小节，飘渺的颤音和轻柔的和弦悬在半空。整段像两个人对视到呼吸都停了：强烈的渴望还在，却引而不发，那股绷紧的劲尚未真正松开。", "t": 297.7, "bars": "72–77", "alt": false}, {"k": "bead", "text": "像忽然陷进一片低气压里：前面的明朗被收走，声音一层层下沉、变暗，注意力反而越来越集中。四周并未彻底暗下去，更像阳光被薄雾柔化——光还在，只是隔了一层朦胧的雾气。", "t": 297.7, "bars": "72–77", "alt": false}, {"k": "line", "text": "他一下安静了，前面还想得那么远，这会儿却连下一个念头都不敢接着想。", "t": 297.7}, {"k": "bead", "text": "这阵安静也像一个人在听自己刚才说过的话。不急着接下一句，只是听着自己的余响；心里还在反复问：“刚才那是真的吗？接下来怎么办？”", "t": 297.7, "bars": "72–77", "alt": false}, {"k": "line", "text": "好在他还记得，对方至今没有退开，眼前这份亲近并没有因为他的担忧就变得不真。", "t": 297.7}, {"k": "bead", "text": "也可以想象成一个人在激动地说了很多话之后，忽然抬头看见夜空，意识到眼前的美好其实比自己的愿望大得多。心里的不安还没有得到回答，却暂时不再占据全部心思。", "t": 297.7, "bars": "72–77", "alt": true}]}, {"bars": "78–83", "rel": "正在面对", "t0": 329.52, "rows": [{"k": "line", "text": "他终于肯暂时不去猜那一天会不会到来，先好好享受眼前两个人还能这样亲近的欢喜。", "t": 329.52}, {"k": "bead", "text": "像一直微微绷着肩膀的人，终于长长呼出一口气，胸腔一下打开。前面压着没说的话有了舒展的空间，眼泪也终于不必再忍。心事并没有解决，只是这一刻不必再强迫自己控制感受；明亮得让人有点想哭。", "t": 329.52, "bars": "78–83", "alt": false}, {"k": "bead", "text": "原先载着小船不断前行的摇荡，仿佛被一阵突然吹进来的清风拨开。时间也松了，旋律像在时间里开出一小块空地，暂时不必跟着水波一直往前走。不过它很短，更像一口终于呼出的气，不是能永远躲进去的避风处。", "t": 329.52, "bars": "78–83", "alt": false}, {"k": "line", "text": "先前那阵紧绷慢慢松下去，他心里亮堂得几乎想笑，也有点想哭。", "t": 329.52}, {"k": "bead", "text": "这一刻，轻的不只是音符。连自己的身体也仿佛失去了重量，像灵魂从躯壳里飘出来，悬浮在夏夜的微风中。原先压在肉身上的沉重负担，仿佛一下子再也碰不到飘起来的自己了。", "t": 329.52, "bars": "78–83", "alt": false}, {"k": "bead", "text": "右手在高音区织出极细、极亮的小音符，像晨曦里的银色蛛丝，又像从天上飘下的细雨，几乎没有重量。其中一串琶音又仿佛飞瀑从极高处倾泻而下，清亮地落进水里。", "t": 329.52, "bars": "78–83", "alt": false}]}, {"bars": "84–92", "rel": "正在面对", "t0": 356.2, "rows": [{"k": "line", "text": "等那阵轻松过去，他发现自己不是只想多享受几次这样的亲近，而是真的愿意长久陪着对方，也不想再躲躲藏藏。", "t": 356.2}, {"k": "bead", "text": "刚才近乎失重、像在梦里漂着，到了第84小节，同一艘船、同一首歌忽然变得异常直接、异常现实。开头旋律刚一唱出便收弱的那份谨慎不见了：厚重的和弦托起歌声，左手温柔的水波翻成横跨几个八度的惊涛骇浪。像之前一直压在心底的话终于说出口：「这是我的感情，我不再为它道歉。」", "t": 356.2, "bars": "84", "alt": false}, {"k": "bead", "text": "到第92小节附近，刚才铺开的力量仿佛短暂地悬在半空，像在等待下一股更大的浪潮。若还记得第32小节那次差一点抵达、却没能真正落定的高潮，这里又可以听出另一层：前面悬置已久的期待，终于得到了某种满足。但这还不是全曲的结束。", "t": 387.24, "bars": "92", "alt": false}, {"k": "line", "text": "这个念头一上来，他高兴得胸口发疼，甚至不想再为自己这么在乎而害臊。", "t": 356.2}, {"k": "bead", "text": "这份灿烂也可能让人不太舒坦。像夕阳在沉入地平线前那一两分钟，天空烧得血红金亮，光芒刺眼到让人想流泪；胸口非但没有舒展开来，反而被压迫得发痛。喜悦已经浓烈到身体几乎承受不住。", "t": 356.2, "bars": "84–92", "alt": false}, {"k": "line", "text": "可他愿意一直陪着，并不等于对方往后都会这样想；他没法替对方作决定，这份欢喜一下变得沉甸甸的，心里疼得厉害。", "t": 356.2}, {"k": "bead", "text": "这次重逢，也像多年后重新走进一间旧房子。家具可能没变，可你知道的事情已经太多了。原来的温柔再次出现，却有了新的重量；而知道它有多珍贵以后，心里反而更容易发疼。", "t": 356.2, "bars": "84–92", "alt": false}]}, {"bars": "93–102", "rel": "正在面对", "t0": 392.84, "rows": [{"k": "line", "text": "想到自己也许能让对方安心些，他忽然不怎么计较自己能得到多少，只想把能给的好都给对方。", "t": 392.84}, {"k": "bead", "text": "第62–71小节那支异常温柔、晴朗的歌，在这里被放到了最大尺度：声音明亮、开阔，近乎英雄式，内声部却彼此拉扯，音乐一浪高过一浪。前面做梦、走神般的状态忽然聚焦到“此时此地”，内心的私语仿佛放大成天地的共振。倒不是“我的感情终于变得比一切都伟大”，反而像整个人被卷进一个比自己更大的世界，连“我”都暂时退到了后面。", "t": 392.84, "bars": "93–102", "alt": false}, {"k": "line", "text": "可这样的日子，他只会嫌不够多，哪怕知道自己再用心也留不住每一个以后，还是盼着能多陪对方一些。", "t": 392.84}, {"k": "bead", "text": "这股声浪却不是一路畅通地冲到顶。原本温柔的歌带上近乎恳求的力量，旋律一次次向上伸展，仿佛还想要更多，却始终不能完全满足。到第96–100小节附近，乐句末端仍有牵扯、延迟与紧张，那口气一直悬到102–103小节交界，才得到一次重大的释放。", "t": 392.84, "bars": "93–102", "alt": false}, {"k": "line", "text": "那一阵高兴终于整个涌了出来，他不再强迫自己收着，只顾痛痛快快地喜欢对方。", "t": 392.84}, {"k": "bead", "text": "这份狂喜像高烧。它也可以像久别重逢：刚才还能够微笑、寒暄，忽然却抱紧对方，久久不愿松手；又可以是喉咙发紧、眼眶湿润，快乐到连自己想笑还是想哭都分不清。", "t": 392.84, "bars": "93–102", "alt": false}]}, {"bars": "103–110", "rel": "正在面对", "t0": 431.0, "rows": [{"k": "line", "text": "那阵高兴过后，他又贪心起来，特别想听到一句以后也不会变的准话，可他心里明白谁也没法答应永远。", "t": 431.0}, {"k": "bead", "text": "第103小节像终于把长久悬着的心愿说出口，音乐却没有就此收住。它在反复与渐强中继续往前推，106小节以后越绷越紧，仿佛怕一停下，刚刚得到的东西就会消失。像刚抵达一道浪峰，身后又有更大的浪推上来，直逼110–111小节交界处的又一次冲击。", "t": 431.0, "bars": "103–110", "alt": false}, {"k": "bead", "text": "起初好像仍在坚持、确认刚才那种灿烂；到107小节以后，明亮的声音里却渐渐掺进越来越尖锐、暗沉的成分。幸福没有消失，悲伤却进入了幸福内部。有时真正「得到」也会疼——像终于把珍贵的东西握在手里，才恍然明白这么好的一刻终究无法永远留住。", "t": 431.0, "bars": "103–110", "alt": false}, {"k": "bead", "text": "也可以把这份阴影听成一段突然插进来的苦涩话语：像刚刚最坚定地说了一声「是」，心里马上有个声音反问：「可是呢？」那个「可是」并没有证明先前的幸福是假的；只有真正相信过，怀疑才会这么疼。", "t": 431.0, "bars": "103–110", "alt": true}, {"k": "line", "text": "要不到这样的保证，他心里越绷越紧，甚至想把已经露出的喜欢往回收一点，仿佛这样就能少受些往后的痛。", "t": 431.0}, {"k": "bead", "text": "下方的脚步仿佛牢牢踩住地面，不肯移动、不肯让步；上方的声音却一次次往下落，像叹息，又像有什么还在反复纠缠。仿佛人明明站得很稳，胸口却一沉再沉。", "t": 431.0, "bars": "103–110", "alt": false}, {"k": "line", "text": "可他早已经没法像最初那样装作不在乎了，而且刚才那份想对对方好的心意也是真的，想收回便更难受。", "t": 431.0}]}, {"bars": "111–116", "rel": "正在面对", "t0": 470.14, "rows": [{"k": "line", "text": "他想起起初连多露一点喜欢都紧张的自己，再想想一路走到现在，心里软下来，又有些发酸。", "t": 470.14}, {"k": "bead", "text": "110–111小节交界，最后一股浪头像是又猛推了一下；进入终结句，音乐才真正松下来、轻下来。心里仍然温热，身体却慢慢恢复了平静。也像从一场美梦里醒来，还记得梦里的光。", "t": 470.14, "bars": "111–115", "alt": false}, {"k": "bead", "text": "就在声音渐渐变轻的时候，第113小节左手内声部幽幽地唱出一句，像男中音独自沉思。先前熟悉的歌唱与摇荡，仿佛又回来了一次。到115小节，右手一道细碎的琶音像水花溅落夜空——低低的一声回望之后，还有最后一闪。", "t": 482.5, "bars": "113–115", "alt": false}, {"k": "bead", "text": "尾声似乎还在与全曲开头隔空说话。第113小节附近，熟悉的声响像隔着很远应了一声；到116小节，最后那几下向上抬起的和弦，又像接住开头悬着的话，终于把它说完。", "t": 482.5, "bars": "113–116", "alt": false}, {"k": "line", "text": "他仍会舍不得，也仍不知道以后怎样，但这会儿还能这么亲近，他不想再催着要一个永远不变的保证。", "t": 499.22}, {"k": "bead", "text": "音乐没有像梦一样慢慢飘走。第116小节，最后几下和弦干脆、沉重，低音像铁锚落入水底，把还在摇荡的小船一下定住。也可以想成一个人经历了强烈的内心震荡后，站起来，整理衣服，关上门。", "t": 499.22, "bars": "116", "alt": false}, {"k": "line", "text": "既然喜欢已经让对方看见，他就不往回藏了，往后会怎样，等真的到了那时再说。", "t": 470.14}]}];
